services:
  app:
    image: "jc21/nginx-proxy-manager:latest"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    environment:
      DB_POSTGRES_HOST: ${DB_POSTGRES_HOST}
      DB_POSTGRES_PORT: ${DB_POSTGRES_PORT}
      DB_POSTGRES_USER: ${DB_POSTGRES_USER}
      DB_POSTGRES_PASSWORD: ${DB_POSTGRES_PASSWORD}
      DB_POSTGRES_NAME: ${DB_POSTGRES_NAME}
    volumes:
      - ${DOCKER_DATA_PATH}/data:/data
      - ${DOCKER_DATA_PATH}/letsencrypt:/etc/letsencrypt
    networks:
      - postgres

networks:
  postgres:
    name: global-postgres-network
    external: true
